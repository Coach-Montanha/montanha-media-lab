name: Build Android APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace --no-daemon -x test -x lint

      - name: Sign & Prepare Release APKs
        run: |
          echo "==> Assinando APKs com apksigner do runner..."
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          export PATH="$BUILD_TOOLS_DIR:$PATH"

          keytool -genkeypair -v -keystore release.keystore -alias montanhakey -keypass montanha123 -storepass montanha123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MontanhaMediaLab,O=Montanha,C=BR"

          mkdir -p release_apks
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            raw_base=$(basename "$apk" .apk)
            clean_name=$(echo "$raw_base" | sed 's/app-//g' | sed 's/-release-unsigned//g' | sed 's/-unsigned//g' | sed 's/-release//g')
            outname="MontanhaMediaLab-${clean_name}.apk"
            echo "Assinando $apk -> release_apks/$outname..."
            apksigner sign --ks release.keystore --ks-pass pass:montanha123 --out "release_apks/$outname" "$apk"
          done

          ls -lh release_apks/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MontanhaMediaLab-APKs
          path: release_apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_apks/*.apk
          tag_name: ${{ github.ref_name }}
          name: Montanha Media Lab ${{ github.ref_name }}
          body: "Download direto do aplicativo nativo oficial Montanha Media Lab compilado pelo GitHub Actions."
