name: Build Android APK Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -x test -x lint

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            app/build/reports/
            ~/.gradle/daemon/

      - name: Prepare APKs for Release
        run: |
          mkdir -p release_apks
          find app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} release_apks/ \;
          cd release_apks
          for f in *.apk; do
            mv "$f" "MontanhaMediaLab-${f}"
          done
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MontanhaMediaLab-APKs
          path: release_apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_apks/*.apk
          tag_name: ${{ github.ref_name }}
          name: Montanha Media Lab ${{ github.ref_name }}
          body: "Download direto do aplicativo nativo Montanha Media Lab compilado automaticamente pelo GitHub Actions."
