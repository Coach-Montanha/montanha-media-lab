      <stop offset="0%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#1E2129"/>
    </linearGradient>
    <linearGradient id="m1" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
